<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gohan Mates | Mates</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Montserrat:wght@800&display=swap"
        rel="stylesheet">

    <!-- Iconos -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <!-- =========================
         NAVBAR
         ========================= -->

    <div id="navbar"></div>


    <!-- =========================
         CATÁLOGO
         ========================= -->

    <section class="catalogo">

        <div class="titulo-catalogo">

            <h1>Mates personalizados</h1>

            <span>
                Elegí tu mate y hacelo único.
            </span>

        </div>


        <!-- PRODUCTOS -->

        <div class="productos" id="productos"></div>

    </section>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer>

        <!-- UBICACIÓN Y MAPA -->

        <div class="footer-ubicacion">

            <div class="footer-lugar">

                <span>📍</span>

                <p>Córdoba, Argentina</p>

            </div>


            <div class="footer-mapa">

                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d217954.95851321027!2d-64.35480037663285!3d-31.399073368027178!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432985f478f5b69%3A0xb0a24f9a5366b092!2zQ8OzcmRvYmE!5e0!3m2!1ses!2sar!4v1789484940051!5m2!1ses!2sar"
                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

            </div>

        </div>


        <!-- COPYRIGHT -->

        <div class="footer-copy">

            <p>© 2026 Gohan Mates.</p>

            <p>Todos los derechos reservados.</p>

        </div>


        <!-- REDES SOCIALES -->

        <div class="footer-redes">

            <a
                href="#"
                target="_blank"
                aria-label="Instagram">

                <i class="fa-brands fa-instagram"></i>

            </a>


            <a
                href="#"
                target="_blank"
                aria-label="WhatsApp">

                <i class="fa-brands fa-whatsapp"></i>

            </a>

        </div>

    </footer>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <!-- NAVBAR -->

    <script type="module">

        import crearNavbar, { configurarLogout } from "../js/components/navbar.js";

        const navbar = document.getElementById("navbar");

        navbar.innerHTML = crearNavbar();

        configurarLogout();

    </script>


    <!-- CARD -->

   <script type="module">

    import crearCard, { configurarCantidad } from "../js/components/card.js";

    const productos = document.getElementById("productos");

    const producto = {

        titulo: "Mate personalizado",

        descripcion: "Mate con grabado láser.",

        precio: 15000,

        imagen: "../assets/mate.jpg"

    };

    productos.innerHTML = crearCard(producto);

    configurarCantidad();

</script>

</body>

</html>
